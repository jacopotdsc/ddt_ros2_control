# friction_test_node parameters (loaded from the installed share/friction_test/config; edit here and
# rebuild). Topics come from ros_utils/topic_names.hpp: joint_states, fsm_state, command/cmd_key,
# command/joint_cmd.
/**:
  ros__parameters:
    use_sim_time: true
    # Joint order of command/joint_cmd: the joints parameter of tita_rl_controller (controllers.yaml).
    joints: [joint_left_leg_1, joint_left_leg_2, joint_left_leg_3, joint_left_leg_4,
             joint_right_leg_1, joint_right_leg_2, joint_right_leg_3, joint_right_leg_4]
    # joint_pd gains, in the order of joints, used for holding and for the tests: the same on every leg joint
    # (abduction, hip, knee); wheels derivative only (kp 0, velocity tracking). 2026-11-01: abduction kp 600 -> 80
    # (with 600 its torque changes so fast that a 2 ms misalignment between torque and state moved Fv 0 -> 1.8).
    joint_kp: [80.0, 80.0, 80.0, 0.0, 80.0, 80.0, 80.0, 0.0]
    joint_kd: [8.0, 8.0, 8.0, 0.5, 8.0, 8.0, 8.0, 0.5]
    # Default pose (key 1, and hold pose of the joints not under test), per leg, both legs:
    # [leg_1 abduction, leg_2 hip pitch, leg_3 knee, leg_4 wheel]. The wheels (continuous) are held
    # where they are instead of being turned back to 0.
    default_pose: [0.0, 0.5, -1.0, 0.0]
    # Test range of each joint, in the order of joints. Must lie inside the URDF limits (the node refuses the
    # test otherwise).
    #   legs (abduction, hip pitch, knee): POSITIONS [rad], the strokes go lower_bound <-> upper_bound;
    #   wheels (leg_4, continuous): SPEEDS [rad/s], the steps go up to upper_bound forward and down to lower_bound
    #   backward (8 rad/s = 0.74 m/s at the rim).
    # URDF limits: abduction [-0.785398, 0.785398], hip pitch [-1.919862, 3.490659], knee [-2.670354, -0.698132] rad;
    #              wheel velocity 50 rad/s
    lower_bound: [-0.685, -1.820, -2.570, -8.0, -0.685, -1.820, -2.570, -8.0]   # URDF: -0.785, -1.920, -2.670, -50 rad/s
    upper_bound: [ 0.685,  3.391, -0.798,  8.0,  0.685,  3.391, -0.798,  8.0]   # URDF:  0.785,  3.491, -0.698,  50 rad/s
    command_rate: 250.0          # Hz, on the simulated clock
    home_ramp_time: 3.0          # s, joint_pd ramp (quintic) to the default pose; also the tests' ramp from the
                                 # default pose to lower_bound and back
    csv_dir: ~/ddt_ros2_ws/src/friction_test/friction_test_csv

    # Trajectory shape (generate_joint_trajectory).
    # Legs: smooth strokes lower_bound -> upper_bound -> lower_bound (velocity 0 at the ends, highest at mid-range;
    # acceleration a triangle per half, peak a_peak at a quarter of the stroke time). Per level
    # a_peak = acc_fraction * acc_max.<joint>; from it, with D = upper_bound - lower_bound:
    #   v at mid-range = sqrt(a_peak D / 2), stroke time = 2 sqrt(2 D / a_peak).
    # Wheels: constant speed steps +v / -v, v = speed_fraction * upper_bound / lower_bound of the wheel, ramps between
    # the steps with peak acceleration acc_max.<wheel>.
    trajectory:
      acc_fractions: [0.1, 0.2, 0.35, 0.5, 0.75, 1.0]     # legs: levels of a_peak, fractions of acc_max
      sweeps_per_level: 2       # legs: back-and-forth (lower -> upper -> lower) strokes per level
      speed_fractions: [0.1, 0.2, 0.35, 0.5, 0.75, 1.0]   # wheels: speed levels, fractions of the bounds
      wheel_hold_time: 4.0      # s at each constant wheel speed
      pause_time: 0.5           # s at rest at the ends of each stroke / step

    # Keys 2-9: one joint per test (the others hold the default pose).
    tests:
      key_2: [joint_left_leg_4]    # left wheel
      key_3: [joint_right_leg_4]   # right wheel
      key_4: [joint_left_leg_3]    # left knee
      key_5: [joint_right_leg_3]   # right knee
      key_6: [joint_left_leg_2]    # left hip pitch
      key_7: [joint_right_leg_2]   # right hip pitch
      key_8: [joint_left_leg_1]    # left abduction
      key_9: [joint_right_leg_1]   # right abduction
    # Peak acceleration of each joint (rad/s^2), the only acceleration parameter of the trajectories.
    # Legs: peak of the strokes at level 1.0 (each level uses acc_fraction * acc_max).
    # With lower_bound/upper_bound above (D = 1.37, 5.21, 1.77 rad) the values below give at mid-range ~1.0
    # (abduction), 1.5 (hip), 1.5 (knee) rad/s and strokes of 2.7, 6.8, 2.4 s (the node prints a, v, T per
    # level when a test starts).
    acc_max:
      joint_left_leg_1: 1.5
      joint_right_leg_1: 1.5
      joint_left_leg_2: 0.9
      joint_right_leg_2: 0.9
      joint_left_leg_3: 2.5
      joint_right_leg_3: 2.5
      # Wheels: peak of the ramps between the speed steps (same at every level).
      joint_left_leg_4: 10.0
      joint_right_leg_4: 10.0
