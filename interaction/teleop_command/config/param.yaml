/**:
  teleop_command:
    ros__parameters:
      uart_interface: /dev/ttyTHS1
      update_rate: 10 # Hz
      use_sdk: false
      joystick_deadzone: 0.013
      speed_ratio: [0.33, 0.66, 1.0]
      max_twist_linear: 0.3    # m/s at full left stick (rl_flat clips at 1.0)
      max_twist_angular: 0.3   # rad/s at full left stick (rl_flat clips at 1.0)
      max_roll: 0.2
      max_pitch: 0.4
