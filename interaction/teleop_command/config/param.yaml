/**:
  teleop_command:
    ros__parameters:
      uart_interface: /dev/ttyTHS1
      update_rate: 10 # Hz
      use_sdk: false
      joystick_deadzone: 0.013
      speed_ratio: [1.0, 1.0, 1.0]  # SPEED selects the controller (none / mpc / mpc): same max
      max_twist_linear: 0.4   # m/s, full stick
      max_twist_angular: 0.6  # rad/s, full stick
      max_roll: 0.2
      max_pitch: 0.4
      height_targets: [0.28, 0.33, 0.35]  # m, cmd_pose.z for CH6 low / medium / high (mpc)
